services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fx-weekly-lease-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weekly_lease
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fx-weekly-lease-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fx-weekly-lease-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fx-weekly-lease-network

  # HashiCorp Vault (dev mode)
  vault:
    image: hashicorp/vault:1.15
    container_name: fx-weekly-lease-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fx-weekly-lease-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fx-weekly-lease-backend
    environment:
      - APP_ENV=dev
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/weekly_lease
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOWED_ORIGINS=["http://localhost:3002","http://localhost:8100"]
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - VAULT_AUTH_METHOD=token
      - VAULT_TRANSIT_KEY_NAME=fx-weekly-lease-dev-transit
      - VAULT_KV_PATH_PREFIX=secret/fx-weekly-lease/dev
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fx-weekly-lease-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fx-weekly-lease-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8100/api
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - fx-weekly-lease-network

volumes:
  postgres_data:
  redis_data:

networks:
  fx-weekly-lease-network:
    driver: bridge
