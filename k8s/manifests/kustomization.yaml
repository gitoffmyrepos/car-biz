# Kustomization for GigWheels
# Use: kubectl apply -k k8s/manifests/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: gigwheels

namespace: gigwheels-prod

labels:
- includeSelectors: true
  pairs:
    app: gigwheels

resources:
- 00-namespace.yaml
- 01-configmap.yaml
- 02-backend-deployment.yaml
- 03-frontend-deployment.yaml
- 04-httproute.yaml
- 05-network-policies.yaml
- 06-external-secrets.yaml
- 07-postgres.yaml
- 08-redis.yaml
- 09-migrate-job.yaml

# Image customization (set via CI/CD).
# Images are pulled from Harbor; deployments pin prod-latest by default.
images:
- name: harbor.strategybase.io/sb-custom-docker-images/gigwheels-backend
  newTag: prod-latest
- name: harbor.strategybase.io/sb-custom-docker-images/gigwheels-frontend
  newTag: prod-latest

# Common annotations
commonAnnotations:
  app.kubernetes.io/name: gigwheels
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"
