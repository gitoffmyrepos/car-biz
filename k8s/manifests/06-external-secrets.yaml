# External Secrets for FX Weekly Lease
# Fetches secrets from Vault KV v2 engine
# Requires External Secrets Operator installed in cluster
---
# SecretStore connecting to Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  labels:
    app: fx-weekly-lease
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "fx-weekly-lease"
          serviceAccountRef:
            name: "fx-weekly-lease-sa"
---
# ExternalSecret that pulls secrets from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fx-weekly-lease-secrets
  labels:
    app: fx-weekly-lease
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: fx-weekly-lease-secrets
    creationPolicy: Owner
  data:
  # Database credentials
  - secretKey: database-url
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/database
      property: url
  - secretKey: redis-url
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/redis
      property: url
  # Vault token for Transit encryption
  - secretKey: vault-token
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/vault
      property: token
  # Email service
  - secretKey: resend-api-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/email
      property: resend_api_key
  # MinIO/S3 credentials
  - secretKey: minio-access-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/minio
      property: access_key
  - secretKey: minio-secret-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/minio
      property: secret_key
  # OIDC credentials
  - secretKey: oidc-client-secret
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/oidc
      property: client_secret
---
# Registry pull secret (for Nexus)
# This should be created manually or via separate ExternalSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-registry-secret
  labels:
    app: fx-weekly-lease
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: nexus-registry-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "nexus.strategybase.io:8082": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf \"%s:%s\" .username .password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: username
    remoteRef:
      key: fx-weekly-lease/common/nexus
      property: username
  - secretKey: password
    remoteRef:
      key: fx-weekly-lease/common/nexus
      property: password
