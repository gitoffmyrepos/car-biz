# External Secrets for FX Weekly Lease
# Fetches secrets from Vault KV v2 engine
# Requires External Secrets Operator installed in cluster
---
# SecretStore connecting to Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  labels:
    app: fx-weekly-lease
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "fx-weekly-lease"
          serviceAccountRef:
            name: "fx-weekly-lease-sa"
---
# ExternalSecret that pulls secrets from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fx-weekly-lease-secrets
  labels:
    app: fx-weekly-lease
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: fx-weekly-lease-secrets
    creationPolicy: Owner
  data:
  # Database credentials
  - secretKey: database-url
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/database
      property: url
  # Dedicated in-namespace Postgres (07-postgres.yaml) bootstrap credentials
  - secretKey: database-user
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/database
      property: user
  - secretKey: database-password
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/database
      property: password
  - secretKey: database-name
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/database
      property: database
  - secretKey: redis-url
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/redis
      property: url
  # Dedicated in-namespace Redis (08-redis.yaml) --requirepass password
  - secretKey: redis-password
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/redis
      property: password
  # Vault token for Transit encryption
  - secretKey: vault-token
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/vault
      property: token
  # Email service
  - secretKey: resend-api-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/email
      property: resend_api_key
  # MinIO/S3 credentials
  - secretKey: minio-access-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/minio
      property: access_key
  - secretKey: minio-secret-key
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/minio
      property: secret_key
  # OIDC credentials
  - secretKey: oidc-client-secret
    remoteRef:
      key: fx-weekly-lease/${ENVIRONMENT}/oidc
      property: client_secret
---
# Harbor registry pull secret (dockerconfigjson)
# car-biz images are built by Argo CI and pushed to
# harbor.strategybase.io/sb-custom-docker-images/car-biz-{backend,frontend}:prod-latest.
# Credentials come from an operator-minted Harbor robot account stored in Vault.
#
# OPERATOR — Vault property that MUST be populated:
#   fx-weekly-lease/common/harbor = { username, password }
#       username -> robot account name (e.g. robot$car-biz+puller)
#       password -> robot account secret/token
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry-secret
  labels:
    app: fx-weekly-lease
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: harbor-registry-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.strategybase.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf \"%s:%s\" .username .password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: username
    remoteRef:
      key: fx-weekly-lease/common/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: fx-weekly-lease/common/harbor
      property: password
