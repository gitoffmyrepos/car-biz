# External Secrets for GigWheels (car-biz)
# Fetches secrets from Vault KV v2 (mount "secret") via the cluster-wide
# ClusterSecretStore `vault-backend` (AppRole auth, terraform_policy=secret/*).
# 2026-06-20: switched off the local k8s-auth SecretStore (the kubernetes auth
# mount has no roles configured) to the proven ClusterSecretStore that every
# other app uses. Vault paths populated under secret/gigwheels/prod/*.
---
# ExternalSecret that pulls secrets from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gigwheels-secrets
  labels:
    app: gigwheels
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gigwheels-secrets
    creationPolicy: Owner
  data:
  # Database credentials
  - secretKey: database-url
    remoteRef:
      key: gigwheels/prod/database
      property: url
  # Dedicated in-namespace Postgres (07-postgres.yaml) bootstrap credentials
  - secretKey: database-user
    remoteRef:
      key: gigwheels/prod/database
      property: user
  - secretKey: database-password
    remoteRef:
      key: gigwheels/prod/database
      property: password
  - secretKey: database-name
    remoteRef:
      key: gigwheels/prod/database
      property: database
  - secretKey: redis-url
    remoteRef:
      key: gigwheels/prod/redis
      property: url
  # Dedicated in-namespace Redis (08-redis.yaml) --requirepass password
  - secretKey: redis-password
    remoteRef:
      key: gigwheels/prod/redis
      property: password
  # Vault token for Transit encryption
  - secretKey: vault-token
    remoteRef:
      key: gigwheels/prod/vault
      property: token
  # Email service
  - secretKey: resend-api-key
    remoteRef:
      key: gigwheels/prod/email
      property: resend_api_key
  # EspoCRM waitlist sync
  - secretKey: espocrm-api-key
    remoteRef:
      key: gigwheels/prod/crm
      property: api_key
  # Proton SMTP credentials
  - secretKey: smtp-user
    remoteRef:
      key: gigwheels/prod/email
      property: smtp_user
  - secretKey: smtp-password
    remoteRef:
      key: gigwheels/prod/email
      property: smtp_password
  # MinIO/S3 credentials
  - secretKey: minio-access-key
    remoteRef:
      key: gigwheels/prod/minio
      property: access_key
  - secretKey: minio-secret-key
    remoteRef:
      key: gigwheels/prod/minio
      property: secret_key
  # OIDC credentials
  - secretKey: oidc-client-secret
    remoteRef:
      key: gigwheels/prod/oidc
      property: client_secret
---
# Harbor registry pull secret (dockerconfigjson)
# gigwheels images are built by Argo CI and pushed to
# harbor.strategybase.io/sb-custom-docker-images/gigwheels-{backend,frontend}:prod-latest.
# Credentials come from an operator-minted Harbor robot account stored in Vault.
#
# OPERATOR — Vault property that MUST be populated:
#   gigwheels/common/harbor = { username, password }
#       username -> robot account name (e.g. robot$car-biz+puller)
#       password -> robot account secret/token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-secret
  labels:
    app: gigwheels
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.strategybase.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ list .username .password | join ":" | b64enc }}"
              }
            }
          }
  data:
  - secretKey: username
    remoteRef:
      key: gigwheels/common/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: gigwheels/common/harbor
      property: password
