# Ingress for FX Weekly Lease
# TLS termination with cert-manager certificates
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fx-weekly-lease-ingress
  labels:
    app: fx-weekly-lease
  annotations:
    # Cert-manager for automatic TLS certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx ingress annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - weekly-lease.strategybase.io
    - api.weekly-lease.strategybase.io
    secretName: fx-weekly-lease-tls
  rules:
  # Frontend routes
  - host: weekly-lease.strategybase.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
  # API routes
  - host: api.weekly-lease.strategybase.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
---
# Certificate resource for TLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fx-weekly-lease-tls
  labels:
    app: fx-weekly-lease
spec:
  secretName: fx-weekly-lease-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: weekly-lease.strategybase.io
  dnsNames:
  - weekly-lease.strategybase.io
  - api.weekly-lease.strategybase.io
