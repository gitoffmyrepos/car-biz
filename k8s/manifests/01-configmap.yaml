# ConfigMap for GigWheels Application
# Non-sensitive configuration values
# Sensitive values sourced from Vault via ExternalSecrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: gigwheels-config
  labels:
    app: gigwheels
data:
  # =============================================================================
  # APPLICATION CONFIGURATION (Non-sensitive)
  # =============================================================================

  # Application Settings
  APP_NAME: "GigWheels"
  APP_VERSION: "1.0.0"
  APP_ENV: "production"
  ENVIRONMENT: "prod"
  DEBUG: "false"

  # Frontend Configuration
  NEXT_PUBLIC_API_URL: "https://gigwheels-api.strategybase.io"
  NEXT_PUBLIC_API_BASE_URL: "https://gigwheels-api.strategybase.io/api"
  NEXT_PUBLIC_APP_URL: "https://gigwheels.strategybase.io"
  INTERNAL_API_BASE_URL: "http://backend-service:8000/api"
  API_BASE_URL: "https://gigwheels.strategybase.io"

  # Chatwoot live-chat widget (deployed in namespace gigwheels-chat).
  # These NEXT_PUBLIC_* are inlined into the client bundle at BUILD time (also
  # set as ARG/ENV in the frontend Dockerfile). The widget renders only when
  # BOTH are non-empty. The operator fills NEXT_PUBLIC_CHATWOOT_TOKEN with the
  # website (inbox) token from Chatwoot admin AFTER the chatwoot stack deploys,
  # then rebuilds the frontend image.
  NEXT_PUBLIC_CHATWOOT_BASE_URL: "https://gigwheels-chat.strategybase.io"
  NEXT_PUBLIC_CHATWOOT_TOKEN: ""

  # Backend Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  CORS_ALLOWED_ORIGINS: "[\"https://gigwheels.strategybase.io\"]"

  # Database Service Endpoints (credentials from Vault)
  # PostgreSQL - Deployed separately or via operator
  POSTGRES_HOST: "postgresql-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "gigwheels"

  # Redis Service Endpoints
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # MinIO/S3 Configuration (credentials from Vault)
  MINIO_HOST: "minio-external.prod-forex.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_BUCKET_PAYMENTS: "gigwheels-payments"
  MINIO_BUCKET_INSURANCE: "gigwheels-insurance"
  MINIO_BUCKET_INCIDENTS: "gigwheels-incidents"
  S3_ENDPOINT: "http://minio-external.prod-forex.svc.cluster.local:9000"
  S3_USE_SSL: "false"
  S3_BUCKET_PAYMENTS: "gigwheels-payments"
  S3_BUCKET_INSURANCE: "gigwheels-insurance"
  S3_BUCKET_INCIDENTS: "gigwheels-incidents"
  S3_BUCKET_CONDITION_REPORTS: "gigwheels-condition-reports"
  S3_BUCKET_VEHICLES: "gigwheels-vehicles"
  S3_BUCKET_VEHICLE_IMAGES: "gigwheels-vehicle-images"

  # Vault Configuration
  VAULT_ADDR: "http://vault-external.prod-forex.svc.cluster.local:8200"
  VAULT_KV_PATH_PREFIX: "secret/gigwheels/prod"
  VAULT_TRANSIT_KEY_NAME: "gigwheels-prod-transit"
  VAULT_AUTH_METHOD: "kubernetes"

  # Keycloak/OIDC Configuration
  KEYCLOAK_HOST: "keycloak.auth.svc.cluster.local"
  KEYCLOAK_REALM: "gigwheels"
  OIDC_ISSUER_URL: "https://auth.strategybase.io/realms/gigwheels"
  OIDC_CLIENT_ID: "gigwheels-app"

  # Rate Limiting
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE: "10"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Email Configuration
  EMAIL_FROM: "noreply@gigwheels.strategybase.io"
  EMAIL_FROM_NAME: "GigWheels"
  RESEND_FROM_EMAIL: "noreply@gigwheels.strategybase.io"
  # Proton SMTP (auto-selected when SMTP_HOST set; user/password from the
  # gigwheels-secrets ExternalSecret). Operator fills the Proton SMTP token in
  # Vault gigwheels/prod/email {smtp_user, smtp_password}.
  EMAIL_BACKEND: "auto"
  SMTP_HOST: "smtp.protonmail.ch"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  SMTP_FROM_EMAIL: "noreply@gigwheels.strategybase.io"

  # Background Jobs
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
