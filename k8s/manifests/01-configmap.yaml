# ConfigMap for FX Weekly Lease Application
# Non-sensitive configuration values
# Sensitive values sourced from Vault via ExternalSecrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: fx-weekly-lease-config
  labels:
    app: fx-weekly-lease
data:
  # =============================================================================
  # APPLICATION CONFIGURATION (Non-sensitive)
  # =============================================================================

  # Application Settings
  APP_NAME: "FX Weekly Lease"
  APP_VERSION: "1.0.0"
  APP_ENV: "production"
  ENVIRONMENT: "prod"
  DEBUG: "false"

  # Frontend Configuration
  NEXT_PUBLIC_API_URL: "https://weekly-lease-api.strategybase.io"
  NEXT_PUBLIC_API_BASE_URL: "https://weekly-lease-api.strategybase.io/api"
  NEXT_PUBLIC_APP_URL: "https://weekly-lease.strategybase.io"
  API_BASE_URL: "https://weekly-lease.strategybase.io"

  # Backend Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  CORS_ALLOWED_ORIGINS: "[\"https://weekly-lease.strategybase.io\"]"

  # Database Service Endpoints (credentials from Vault)
  # PostgreSQL - Deployed separately or via operator
  POSTGRES_HOST: "postgresql-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fx_weekly_lease"

  # Redis Service Endpoints
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # MinIO/S3 Configuration (credentials from Vault)
  MINIO_HOST: "minio-external.prod-forex.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_BUCKET_PAYMENTS: "fx-weekly-lease-payments"
  MINIO_BUCKET_INSURANCE: "fx-weekly-lease-insurance"
  MINIO_BUCKET_INCIDENTS: "fx-weekly-lease-incidents"
  S3_ENDPOINT: "http://minio-external.prod-forex.svc.cluster.local:9000"
  S3_USE_SSL: "false"
  S3_BUCKET_PAYMENTS: "fx-weekly-lease-payments"
  S3_BUCKET_INSURANCE: "fx-weekly-lease-insurance"
  S3_BUCKET_INCIDENTS: "fx-weekly-lease-incidents"
  S3_BUCKET_CONDITION_REPORTS: "fx-weekly-lease-condition-reports"
  S3_BUCKET_VEHICLES: "fx-weekly-lease-vehicles"
  S3_BUCKET_VEHICLE_IMAGES: "car-biz-vehicle-images"

  # Vault Configuration
  VAULT_ADDR: "http://vault-external.prod-forex.svc.cluster.local:8200"
  VAULT_KV_PATH_PREFIX: "secret/fx-weekly-lease/prod"
  VAULT_TRANSIT_KEY_NAME: "fx-weekly-lease-prod-transit"
  VAULT_AUTH_METHOD: "kubernetes"

  # Keycloak/OIDC Configuration
  KEYCLOAK_HOST: "keycloak.auth.svc.cluster.local"
  KEYCLOAK_REALM: "fx-weekly-lease"
  OIDC_ISSUER_URL: "https://auth.strategybase.io/realms/fx-weekly-lease"
  OIDC_CLIENT_ID: "fx-weekly-lease-app"

  # Rate Limiting
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE: "10"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Email Configuration (Resend API key from Vault)
  EMAIL_FROM: "noreply@strategybase.io"
  EMAIL_FROM_NAME: "FX Weekly Lease"
  RESEND_FROM_EMAIL: "noreply@strategybase.io"

  # Background Jobs
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
