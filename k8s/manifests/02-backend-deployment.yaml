# Backend Deployment for FX Weekly Lease
# FastAPI application serving API endpoints
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-weekly-lease-backend
  labels:
    app: fx-weekly-lease
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fx-weekly-lease
      component: backend
  template:
    metadata:
      labels:
        app: fx-weekly-lease
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fx-weekly-lease-sa
      # Pod anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: harbor.strategybase.io/sb-custom-docker-images/car-biz-backend:prod-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: fx-weekly-lease-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Secrets from Vault via ExternalSecrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: redis-url
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: vault-token
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: resend-api-key
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: minio-secret-key
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: fx-weekly-lease-secrets
              key: oidc-client-secret
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-logs
          mountPath: /app/logs
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      imagePullSecrets:
      - name: nexus-registry-secret
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: app-logs
        emptyDir:
          sizeLimit: 500Mi
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: fx-weekly-lease
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: fx-weekly-lease
    component: backend
