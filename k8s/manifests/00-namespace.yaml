# Namespace for GigWheels (car-biz) — PROD.
# Follows FX homelab naming conventions.
#
# 2026-06-19: reduced to a single (prod) namespace + SA. The kustomization's
# `namespace:` transformer rewrites every resource's namespace AND every
# Namespace object's name; having both a dev and a prod Namespace here made the
# transformer collapse both to one name -> "namespace transformation produces ID
# conflict". A dev environment, if needed later, belongs in a separate overlay,
# not duplicated in this base.
apiVersion: v1
kind: Namespace
metadata:
  name: gigwheels-prod
  labels:
    app: gigwheels
    environment: prod
    # kgateway only discovers/attaches HTTPRoutes in namespaces carrying this
    # label (KGW_DISCOVERY_NAMESPACE_SELECTORS). Without it the routes get
    # status.parents:[] and the gateway 404s the host. 2026-06-20.
    kgateway.dev/discover: "true"
    # This namespace includes embedded Postgres and Redis. Keep it out of
    # ambient mesh; datastore protocols have previously hung behind ztunnel.
    istio.io/dataplane-mode: none
---
# ServiceAccount for the application (Vault k8s-auth role binds to this SA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gigwheels-sa
  namespace: gigwheels-prod
  labels:
    app: gigwheels
